alertmanager:
  enabled: false
grafana:
  adminUser: admin
  enabled: true
  persistence:
    enabled: false
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  service:
    type: ClusterIP
kubeStateMetrics:
  enabled: true
  resources:
    limits:
      cpu: 100m
      memory: 100Mi
    requests:
      cpu: 25m
      memory: 50Mi
nodeExporter:
  enabled: true
prometheus:
  enabled: true
  prometheusSpec:
    evaluationInterval: 30s
    replicas: 1
    resources:
      limits:
        cpu: 500m
        memory: 768Mi
      requests:
        cpu: 100m
        memory: 384Mi
    retention: 24h
    scrapeInterval: 30s
prometheusOperator:
  resources:
    limits:
      cpu: 200m
      memory: 200Mi
    requests:
      cpu: 50m
      memory: 100Mi
