apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-capstone-ingress
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/subnets: subnet-0e63a769e506457cc,subnet-0aea482a4e4c089ee
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-capstone-app
                port:
                  number: 80
